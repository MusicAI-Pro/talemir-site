<!doctype html>
<html lang="ru">
<head>
<meta name="talemir-api" content="">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta property="og:title" content="Talemir">
<meta property="og:image" content="https://talemir.com/img/hero_ru.jpg">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Talemir</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Персональная сказка по фотографиям: ваш ребёнок и вся семья — герои печатной книги.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Montserrat+Alternates:wght@600;700&family=Nunito:wght@400;600;700;800&family=Noto+Kufi+Arabic:wght@400;600;700&family=Noto+Sans+Armenian:wght@400;600;700&display=swap">
<style>
/* Layout: the page is a picture book — the hero is an open spread (text page + illustration page) on a plum book-cloth band; sections below are calm pages with folio numbers. */
:root{
  --paper:#F7F4FB; --card:#FFFFFF; --ink:#23173A; --muted:#62577A; --line:#E2DAEE;
  --cloth:#2E1F4F; --cloth-ink:#F5EFFF; --gold:#E2A23A; --gold-ink:#3A2606; --pome:#C3404C;
  --shadow:0 18px 50px rgba(35,23,58,.16);
  --f-brand:"Marck Script", cursive;
  --f-display:"Montserrat Alternates","Nunito",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#14101D; --card:#1D1729; --ink:#F1ECF8; --muted:#B0A6C4; --line:#33294A;
  --cloth:#231839; --cloth-ink:#F5EFFF; --gold:#EDB250; --gold-ink:#2A1A02; --pome:#E5707A;
  --shadow:0 18px 50px rgba(0,0,0,.45); color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#14101D; --card:#1D1729; --ink:#F1ECF8; --muted:#B0A6C4; --line:#33294A;
  --cloth:#231839; --cloth-ink:#F5EFFF; --gold:#EDB250; --gold-ink:#2A1A02; --pome:#E5707A;
  --shadow:0 18px 50px rgba(0,0,0,.45); color-scheme:dark }
:lang(ar){ --f-display:"Noto Kufi Arabic",system-ui,sans-serif; --f-body:"Noto Kufi Arabic",system-ui,sans-serif }
:lang(hy){ --f-display:"Noto Sans Armenian","Nunito",sans-serif; --f-body:"Noto Sans Armenian","Nunito",sans-serif }

*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} *{transition:none!important;animation:none!important} }
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;margin:0}
.wrap{max-width:1160px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h2{font-size:clamp(1.6rem,3.4vw,2.4rem)}
p{margin:0}
a{color:inherit}
button,select,input{font:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;border:0;cursor:pointer;border-radius:999px;padding:.95em 1.6em;font-weight:800;text-decoration:none;transition:transform .15s ease, box-shadow .15s ease}
.btn-gold{background:var(--gold);color:var(--gold-ink);box-shadow:0 6px 0 color-mix(in srgb,var(--gold) 55%,#000)}
.btn-gold:hover{transform:translateY(-2px)}
.btn-ghost{background:transparent;color:inherit;border:2px solid currentColor;opacity:.9}
.kicker{font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:.78rem;color:var(--pome)}
:lang(ar) .kicker,:lang(hy) .kicker{letter-spacing:0}

/* header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--cloth)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--cloth);color:var(--cloth-ink)}
.bar{display:flex;align-items:center;gap:16px;padding-block:10px}
.brand{font-family:var(--f-brand);font-size:2rem;line-height:1;text-decoration:none;color:var(--gold)}
.tag{font-size:.7rem;font-weight:800;border:1px solid color-mix(in srgb,var(--cloth-ink) 40%,transparent);border-radius:999px;padding:.15em .6em;opacity:.8}
nav.links{display:flex;gap:20px;margin-inline-start:auto;font-weight:700;font-size:.95rem}
nav.links a{text-decoration:none;opacity:.85}
nav.links a:hover{opacity:1}
.langs{display:flex;gap:4px;flex-wrap:wrap}
.langs button{background:transparent;border:1px solid transparent;color:var(--cloth-ink);border-radius:999px;padding:.25em .65em;font-size:.85rem;cursor:pointer;opacity:.75}
.langs button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold);opacity:1}
.bar .btn{padding:.6em 1.1em;font-size:.9rem}
@media (max-width:900px){ nav.links{display:none} .bar{flex-wrap:wrap} .langs{order:3;width:100%;justify-content:center} .bar .btn{margin-inline-start:auto} }

/* hero spread */
.cloth{background:var(--cloth);color:var(--cloth-ink);padding-block:28px 56px}
.spread{display:grid;grid-template-columns:1fr 1fr;background:var(--card);color:var(--ink);border-radius:10px 10px 10px 10px;box-shadow:0 30px 80px rgba(0,0,0,.35);position:relative;overflow:hidden}
.spread::after{content:"";position:absolute;inset-block:0;inset-inline-start:calc(50% - 30px);width:60px;background:linear-gradient(90deg,transparent,rgba(0,0,0,.10),transparent);pointer-events:none}
.page-txt{padding:clamp(24px,4.5vw,56px);display:flex;flex-direction:column;gap:18px;justify-content:center;min-width:0}
.page-txt h1{font-size:clamp(2rem,4.4vw,3.3rem);color:var(--ink)}
.page-txt h1 .hl{color:var(--pome)}
.lead{font-size:1.1rem;color:var(--muted);max-width:34em}
.ctas{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.ctas .btn-ghost{color:var(--ink)}
.note{font-size:.92rem;color:var(--muted)}
.pricechip{display:inline-flex;gap:.4em;align-items:center;font-weight:800;background:color-mix(in srgb,var(--gold) 20%,var(--card));border-radius:999px;padding:.35em .9em;width:max-content;max-width:100%}
.page-img{position:relative;min-width:0}
.page-img img{display:block;width:100%;height:100%;object-fit:cover;aspect-ratio:1/1}
.cap{position:absolute;inset-block-end:12px;inset-inline-start:12px;background:rgba(20,14,32,.72);color:#fff;font-size:.78rem;border-radius:999px;padding:.3em .8em}
.folio{position:absolute;inset-block-end:10px;font-family:var(--f-brand);font-size:1.1rem;color:var(--muted)}
.folio.l{inset-inline-start:22px}
@media (max-width:820px){ .spread{grid-template-columns:1fr} .spread::after{display:none} .page-img{order:-1} .folio{display:none} }

/* trust */
.trust{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:28px}
.trust div{display:flex;flex-direction:column;gap:2px;padding-inline-start:14px;border-inline-start:2px solid var(--gold)}
.trust b{font-size:1rem}
.trust span{font-size:.88rem;opacity:.8}
@media (max-width:820px){ .trust{grid-template-columns:1fr 1fr} }
@media (max-width:440px){ .trust{grid-template-columns:1fr} }

section{padding-block:72px}
.sec-head{display:flex;flex-direction:column;gap:10px;margin-bottom:32px;max-width:46rem}
.sec-head p{color:var(--muted);font-size:1.08rem}

/* steps: a real sequence, so numbered */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;counter-reset:s}
.step{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:26px;display:flex;flex-direction:column;gap:10px}
.step::before{counter-increment:s;content:counter(s);font-family:var(--f-brand);font-size:2.6rem;line-height:1;color:var(--pome)}
.step h3{font-size:1.2rem}
.step p{color:var(--muted)}
@media (max-width:820px){ .steps{grid-template-columns:1fr} }

/* family */
.family{display:grid;grid-template-columns:1.05fr 1fr;gap:40px;align-items:center}
.family figure{margin:0;position:relative}
.family img{width:100%;border-radius:24px;box-shadow:var(--shadow);display:block}
.family ul{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:10px}
.family li{display:flex;gap:10px;align-items:baseline;font-weight:700}
.family li::before{content:"✦";color:var(--gold)}
.next{margin-top:18px;padding:16px 18px;border-radius:14px;background:color-mix(in srgb,var(--gold) 16%,var(--card));font-weight:600}
@media (max-width:820px){ .family{grid-template-columns:1fr} }

/* hero v2: всё, что умеем, — на первом экране */
.hero2{padding-block:34px 48px;text-align:center}
.hero2 .kicker{color:var(--gold)}
.hero2 h1{font-size:clamp(1.9rem,4.6vw,3.4rem);color:var(--cloth-ink);max-width:20em;margin:10px auto 0}
.hero2 .lead{color:color-mix(in srgb,var(--cloth-ink) 80%,transparent);margin:14px auto 0;max-width:46em}
.pchips{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:22px auto 0;max-width:980px}
.pchip{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--cloth-ink);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:8px 16px 8px 8px;font-weight:800;transition:background .2s,transform .2s,border-color .2s}
.pchip:hover{background:rgba(255,255,255,.16);border-color:var(--gold);transform:translateY(-2px)}
.pchip i{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--gold);color:var(--gold-ink);font-style:normal}
.pchip i svg{width:18px;height:18px}
.pchip small{font-weight:700;opacity:.75;font-size:.82rem}
.hv2{position:relative;max-width:1040px;margin:26px auto 0;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#1b1230;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.hv2 video{display:block;width:100%;height:100%;object-fit:contain}
.hv-sound{position:absolute;top:12px;inset-inline-end:12px;font:inherit;font-weight:800;font-size:.85rem;border:0;border-radius:999px;padding:8px 14px;background:rgba(255,255,255,.92);color:#231a3a;cursor:pointer}
.hv-sound:focus-visible{outline:3px solid #f0b84e;outline-offset:2px}
.hv-steps{max-width:1040px;margin:12px auto 0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;counter-reset:s}
.hv-steps li{counter-increment:s;font-size:.86rem;font-weight:800;line-height:1.25;color:var(--cloth-ink);background:rgba(255,255,255,.07);border-radius:12px;padding:9px 10px;opacity:.6;transition:opacity .3s,background .3s,color .3s}
.hv-steps li::before{content:counter(s) "  ";color:var(--gold)}
.hv-steps li.on{opacity:1;background:var(--gold);color:var(--gold-ink)}
.hv-steps li.on::before{color:var(--gold-ink)}
.hvcap{font-size:.86rem;opacity:.7;margin-top:10px}
.hero2 .ctas{justify-content:center;margin-top:22px}
.hero2 .ctas .btn-ghost{color:var(--cloth-ink)}
@media (max-width:600px){.hv-steps{gap:4px}.hv-steps li{font-size:.68rem;padding:6px 5px;border-radius:9px}.hv-sound{font-size:.75rem;padding:6px 10px;top:8px}.pchip{padding:6px 12px 6px 6px;font-size:.88rem}.pchip i{width:28px;height:28px}}
/* products */
.prods{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.prod{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;scroll-margin-top:90px;transition:transform .2s,box-shadow .2s}
.prod:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.prod .media{position:relative;aspect-ratio:16/9;background:#1b1230}
.prod .media img,.prod .media video{display:block;width:100%;height:100%;object-fit:cover}
.prod .media.song{display:flex;flex-direction:column;justify-content:center;gap:8px;padding:10px 12px;overflow:hidden;background:linear-gradient(135deg,#3b2470,#c3404c);color:#fff}
.prod .media.song b{font-family:var(--f-display);font-size:.9rem;line-height:1.15}
.prod .media.song audio{width:100%;height:36px}
.prod .exc{font-size:.76rem;line-height:1.45;color:var(--muted);padding:8px 16px 0;margin:0;flex:none;min-height:calc(2.9em + 8px)}
.prod .play{position:absolute;inset:0;margin:auto;width:62px;height:62px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#2e1f4f;cursor:pointer;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.35);transition:transform .2s}
.prod .play:hover{transform:scale(1.08)}
.prod .play svg{width:26px;height:26px;margin-inline-start:4px}
nav.links a,.bar .btn,.langs button{white-space:nowrap}
nav.links{gap:16px}
@media (max-width:1420px){nav.links a[href="#how"],nav.links a[href="#faq"]{display:none}}
@media (max-width:600px){.pchip small{display:none}.pchips{gap:8px}}
.prod .body{padding:10px 16px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.prod h3{margin:0;font-size:1.06rem}
.prod p{margin:0;font-size:.93rem;color:var(--muted);flex:1}
.prod .pp{font-weight:800}
.prod .btn{padding:10px 14px;font-size:.92rem;width:100%}
@media (max-width:1100px){.prods{grid-template-columns:repeat(2,1fr)}.prod:last-child{grid-column:1/-1}.prod:last-child .media{aspect-ratio:21/9}}
@media (max-width:640px){.prods{grid-template-columns:1fr}.prod:last-child .media{aspect-ratio:16/9}}
/* styles: 1 большой + 12 малых = ровная сетка 4×4 */
.styles2{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;grid-auto-flow:dense}
.sty{all:unset;box-sizing:border-box;position:relative;cursor:pointer;border-radius:16px;overflow:hidden;aspect-ratio:1/1;box-shadow:0 8px 24px rgba(35,23,58,.14);outline:3px solid transparent;transition:transform .25s ease,box-shadow .25s ease,outline-color .25s}
.sty img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .5s ease,filter .3s}
.sty span{position:absolute;inset:auto 0 0 0;padding:28px 12px 10px;background:linear-gradient(transparent,rgba(20,12,40,.85));color:#fff;font-weight:800;font-size:.92rem;line-height:1.2;text-align:start}
.sty:hover,.sty:focus-visible{transform:translateY(-5px);box-shadow:0 18px 40px rgba(35,23,58,.28);outline-color:var(--gold)}
.sty:hover img,.sty:focus-visible img{transform:scale(1.08)}
.sty.big{grid-column:span 2;grid-row:span 2;cursor:default;outline-color:var(--gold)}
.sty.big span{font-size:1.35rem;padding:40px 18px 16px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.sty.big .btn{padding:.6em 1.1em;font-size:.9rem}
@media (max-width:640px){.styles2{grid-template-columns:repeat(2,1fr);gap:10px}.sty span{font-size:.8rem}.sty.big span{font-size:1.1rem}}
/* family */
.family figure img{height:auto;aspect-ratio:1/1;object-fit:cover}
.family figcaption{font-size:.85rem;color:var(--muted);margin-top:8px}

/* languages */
.band{background:var(--cloth);color:var(--cloth-ink)}
.band .sec-head p{color:color-mix(in srgb,var(--cloth-ink) 78%,transparent)}
.heroes{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.heroes button{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:10px;border-radius:16px}
.heroes img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:16px;border:3px solid transparent;display:block}
.heroes button[aria-pressed="true"] img{border-color:var(--gold)}
.heroes span{font-weight:800;text-align:center}
.heroes button:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
@media (max-width:820px){ .heroes{grid-template-columns:repeat(3,1fr)} }
@media (max-width:440px){ .heroes{grid-template-columns:repeat(2,1fr)} }

/* prices */
.price-top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.cur{display:flex;gap:8px;align-items:center;font-weight:700}
.cur select{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:.4em .6em}
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;align-items:stretch}
.tier{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px;display:flex;flex-direction:column;gap:12px}
.tier.main{border:2px solid var(--gold);box-shadow:var(--shadow)}
.tier h3{font-size:1.25rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.badge{font-family:var(--f-body);font-size:.75rem;font-weight:800;background:var(--gold);color:var(--gold-ink);border-radius:999px;padding:.2em .7em}
.amount{font-family:var(--f-display);font-size:2.2rem;font-variant-numeric:tabular-nums}
.tier p{color:var(--muted);flex:1}
.tier .btn{width:100%}
@media (max-width:860px){ .tiers{grid-template-columns:1fr} }

/* occasions + loyalty + privacy */
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:26px;display:flex;flex-direction:column;gap:12px}
.panel h3{font-size:1.2rem}
.panel ul{margin:0;padding-inline-start:1.1em;display:grid;gap:8px}
.panel li::marker{color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{background:color-mix(in srgb,var(--pome) 12%,var(--card));border:1px solid color-mix(in srgb,var(--pome) 30%,transparent);border-radius:999px;padding:.35em .9em;font-weight:700;font-size:.95rem}
@media (max-width:900px){ .three{grid-template-columns:1fr} }

/* faq */
.faq{display:grid;gap:12px;max-width:52rem}
.faq details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 20px}
.faq summary{cursor:pointer;font-weight:800;font-size:1.05rem}
.faq details p{margin-top:10px;color:var(--muted)}

.final{text-align:center;display:flex;flex-direction:column;gap:22px;align-items:center}
.final h2{max-width:22em}
footer{padding-block:28px;border-top:1px solid var(--line);color:var(--muted);font-size:.92rem}
footer .wrap{display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap;align-items:center}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(15,10,25,.6);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--card);color:var(--ink);border-radius:20px;width:min(560px,100%);max-height:100%;overflow:auto;padding:26px;display:flex;flex-direction:column;gap:14px}
.sheet h3{font-size:1.4rem}
.row{display:flex;flex-direction:column;gap:6px}
.row2{display:grid;grid-template-columns:2fr 1fr;gap:12px}
.sheet label{font-weight:700;font-size:.92rem}
.sheet input[type=text],.sheet input[type=number],.sheet select{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:.6em .8em;width:100%}
.hint{font-size:.85rem;color:var(--muted)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs img{width:56px;height:56px;object-fit:cover;border-radius:8px}
.consent{display:flex;gap:10px;align-items:flex-start;font-weight:600;font-size:.9rem}
.err{color:var(--pome);font-weight:700;font-size:.9rem}
.sheet .acts{display:flex;gap:10px;flex-wrap:wrap}
.sheet .btn-ghost{color:var(--ink)}
</style>

</head>
<body>
<header>
  <div class="wrap bar">
    <a class="brand" href="#top">Talemir</a>
    <span class="tag" data-i="proto"></span>
    <nav class="links">
      <a href="#products" data-i="nav_prod"></a><a href="#how" data-i="nav_how"></a><a href="#styles" data-i="nav_styles"></a><a href="#prices" data-i="nav_price"></a><a href="#faq" data-i="nav_faq"></a>
    </nav>
    <div class="langs" id="langs" role="group" aria-label="Language"></div>
    <a class="btn btn-gold" href="#products" data-i="nav_cta"></a>
  </div>
</header>

<main id="top">
  <div class="cloth hero2">
    <div class="wrap">
      <span class="kicker" data-i="hv_kicker"></span>
      <h1 data-i="hero_h1"></h1>
      <p class="lead" data-i="hero_sub"></p>
      <nav class="pchips" id="pchips" aria-label="Talemir"></nav>
      <div class="hv2">
        <video id="heroVid" src="img/hero_v3.mp4" poster="img/hero_v3_poster.jpg" autoplay muted loop playsinline preload="auto" width="1920" height="1080"></video>

let lang = detectLang();
let cur = (()=>{ try { const c = localStorage.getItem('tm_cur'); if (PRICES[c]) return c; } catch(e){} return C_CUR[country] || 'USD'; })();

function money(v){ return '\u2068' + money0(v) + '\u2069'; }
function money0(v){ try { return new Intl.NumberFormat(LOCALE[lang], {style:'currency', currency:cur, maximumFractionDigits:0}).format(v); } catch(e){ return v + ' ' + cur; } }
function t(k){ return (I18N[lang] && I18N[lang][k]) ?? I18N.en[k] ?? I18N.ru[k] ?? ''; }

const STYLES = [["st_3d", "st_3d"], ["st_water", "st_water"], ["st_pencil", "st_pencil"], ["st_paper", "st_paper"], ["st_clay", "st_clay"], ["st_khokh", "st_khokh"], ["st_gzhel", "st_gzhel"], ["st_palekh", "st_palekh"], ["st_lubok", "st_lubok"], ["st_film", "st_film"], ["st_kaz", "st_kaz"], ["st_minia", "st_minia"], ["st_arab", "st_arab"]];

const PRODS = [['book','pdf'],['song','song'],['clip','clip'],['live','live'],['ny','ny']];
const ICONS = {"book": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z\"/><path d=\"M4 19V5\"/></svg>", "song": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M9 18V5l11-2v13\"/><circle cx=\"6\" cy=\"18\" r=\"3\"/><circle cx=\"17\" cy=\"16\" r=\"3\"/></svg>", "clip": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><path d=\"M10 9l5 3-5 3z\"/></svg>", "live": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M12 3l1.8 4.6L18 9l-4.2 1.4L12 15l-1.8-4.6L6 9l4.2-1.4z\"/><path d=\"M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z\"/></svg>", "ny": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M12 2v20M4.9 6l14.2 12M19.1 6L4.9 18\"/><path d=\"M9 3.5l3 2 3-2M9 20.5l3-2 3 2\"/></svg>"};
function media(k){
  if (k==='book') return `<div class="media"><img src="img/ex/ex_book.jpg" alt="${t('ex_book')}" loading="lazy" width="1056" height="592"></div>`;
  if (k==='song') return `<div class="media song"><b>${t('p_song_t')}</b><audio controls preload="none" src="img/ex/ex_song.mp3"></audio></div>`;
  const v = {clip:['ex_clip.mp4','ex_clip.jpg'], live:['ex_live2.mp4','ex_live2.jpg'], ny:['ex_ny169.mp4','ex_ny169.jpg']}[k];
  return `<div class="media"><video playsinline preload="none" poster="img/ex/${v[1]}" src="img/ex/${v[0]}" ${k==='live'?'loop':''}></video><button type="button" class="play" data-play aria-label="${t('p_'+k+'_t')}"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg></button></div>`;
}
let styleSel = 'st_3d';
function renderStyles(){
  const order = [STYLES.find(x=>x[0]===styleSel), ...STYLES.filter(x=>x[0]!==styleSel)];
  document.getElementById('stylesGrid').innerHTML = order.map(([img,k],i) => i===0
    ? `<div class="sty big" role="group" aria-label="${t(k)}"><img src="${IMG[img]}" alt="${t(k)}" width="600" height="600"><span>${t(k)}<button type="button" class="btn btn-gold" data-open="book" data-style="${k}">${t('st_pick')}</button></span></div>`
    : `<button type="button" class="sty" data-sty="${img}" aria-label="${t(k)}"><img src="${IMG[img]}" alt="" loading="lazy" width="600" height="600"><span>${t(k)}</span></button>`).join('');
}
document.getElementById('stylesGrid').addEventListener('click', e => {
  const b = e.target.closest('[data-sty]'); if (!b) return;
  styleSel = b.dataset.sty; renderStyles();
  document.querySelector('#stylesGrid .sty.big').scrollIntoView({behavior:'smooth', block:'nearest'});
});
let curProd = 'book';
function fillSelects(){
  const fp = document.getElementById('fProd'); fp.innerHTML = PRODS.map(([k]) => `<option value="${k}">${t('p_'+k+'_t')}</option>`).join(''); fp.value = curProd;
  document.getElementById('fOcc').innerHTML = (I18N[lang].oc || I18N.en.oc).map(o => `<option>${o}</option>`).join('');
  document.getElementById('fGenre').innerHTML = ['g_pop','g_lull','g_rock','g_folk'].map(g => `<option value="${g}">${t(g)}</option>`).join('');
  document.getElementById('fGender').innerHTML = `<option value="f">${t('f_girl')}</option><option value="m">${t('f_boy')}</option>`;
}
function syncForm(){
  document.getElementById('fTitle').textContent = t('p_'+curProd+'_t');
  document.querySelectorAll('#form [data-for]').forEach(el => { el.hidden = !el.dataset.for.split(' ').includes(curProd); });
  const nl = document.getElementById('fNameL'); nl.dataset.i = curProd==='song' ? 'f_for' : 'f_name'; nl.textContent = t(nl.dataset.i);
  const pl = document.getElementById('fPhotosL'); pl.dataset.i = curProd==='clip' ? 'f_photos_clip' : curProd==='live' ? 'f_photos_live' : 'f_photos'; pl.textContent = t(pl.dataset.i);
  const sb = document.querySelector('#form button[type=submit]'); sb.dataset.i = curProd==='book' ? 'f_submit' : 'f_submit2'; sb.textContent = t(sb.dataset.i);
}
document.addEventListener('click', e => {
  const pb = e.target.closest('[data-play]'); if (!pb) return;
  const v = pb.parentElement.querySelector('video');
  document.querySelectorAll('.prod video, .prod audio').forEach(x => { if (x !== v) x.pause(); });
  v.controls = true; pb.hidden = true; v.play().catch(()=>{});
});
document.addEventListener('play', e => { if (e.target.closest && e.target.closest('.prod')) { if (heroVid && !heroVid.muted) { heroVid.muted = true; document.getElementById('hvSound').textContent = t('hv_sound'); } document.querySelectorAll('.prod video, .prod audio').forEach(x => { if (x !== e.target) x.pause(); }); } }, true);
document.addEventListener('change', e => { if (e.target.id === 'fProd') { curProd = e.target.value; syncForm(); } });
const heroVid = document.getElementById('heroVid');
const HV_MARKS = [0, 4.1, 34.2, 48.1];
if (heroVid) {
  heroVid.addEventListener('timeupdate', () => {
    const tt = heroVid.currentTime; let k = 0;
    for (let i = 0; i < 3; i++) if (tt >= HV_MARKS[i]) k = i;
    if (tt >= HV_MARKS[3]) k = -1;
    document.querySelectorAll('#hvSteps li').forEach((li, i) => li.classList.toggle('on', i === k));
  });
  document.getElementById('hvSound').addEventListener('click', () => {
    heroVid.muted = !heroVid.muted; if (!heroVid.muted) { heroVid.currentTime = 0; heroVid.play().catch(()=>{}); }
    document.getElementById('hvSound').textContent = t(heroVid.muted ? 'hv_sound' : 'hv_mute');
  });
}
function render(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i]').forEach(el => { el.textContent = t(el.dataset.i); });
  document.querySelectorAll('[data-p]').forEach(el => el.textContent = money(PRICES[cur][el.dataset.p]));
  document.getElementById('curSel').value = cur;
  const hs = document.getElementById('hvSound'); if (hs) hs.textContent = t(heroVid && !heroVid.muted ? 'hv_mute' : 'hv_sound');
  const fi = document.getElementById('famImg'); fi.src = IMG.family; fi.alt = t('fam_cap');
  fillSelects(); syncForm();
  document.getElementById('langs').innerHTML = SUP.map(l => `<button type="button" data-l="${l}" aria-pressed="${l===lang}" lang="${l}">${I18N[l]['lang_'+l]}</button>`).join('');
  document.getElementById('heroes').innerHTML = SUP.map(l => `<button type="button" data-l="${l}" aria-pressed="${l===lang}" lang="${l}"><img src="${IMG['hero_'+l]}" alt="${I18N[l]['lang_'+l]}"><span>${I18N[l]['lang_'+l]}</span></button>`).join('');
  document.getElementById('pchips').innerHTML = PRODS.map(([k,p]) => `<a class="pchip" href="#p-${k}"><i>${ICONS[k]}</i><span>${t('c_'+k)} <small>${t('p_from').replace('{p}', money(PRICES[cur][p]))}</small></span></a>`).join('');
  document.getElementById('prods').innerHTML = PRODS.map(([k,p]) => `<article class="prod" id="p-${k}">${media(k)}<p class="exc">${t('ex_'+k)}</p><div class="body"><h3>${t('p_'+k+'_t')}</h3><p>${t('p_'+k+'_d')}</p><span class="pp">${t('p_from').replace('{p}', money(PRICES[cur][p]))}</span><button class="btn btn-gold" data-open="${k}">${t('p_order')}</button></div></article>`).join('');
  renderStyles();
  document.getElementById('occ').innerHTML = (I18N[lang].oc || I18N.en.oc).map(o => `<span>${o}</span>`).join('');
  document.getElementById('fLang').innerHTML = SUP.map(l => `<option value="${l}" ${l===lang?'selected':''}>${I18N[l]['lang_'+l]}</option>`).join('');
  document.getElementById('fStyle').innerHTML = STYLES.map(([,k]) => `<option value="${k}">${t(k)}</option>`).join('');
  updateSel();
}
function setLang(l){ lang = l; try { localStorage.setItem('tm_lang', l); } catch(e){} render(); }
document.addEventListener('click', e => {
  const b = e.target.closest('[data-l]'); if (b) { setLang(b.dataset.l); return; }
  const op = e.target.closest('[data-open]'); if (op) { openModal(op.dataset.open || 'book', op.dataset.style); return; }
  if (e.target.closest('[data-close]') || e.target.id === 'modal') closeModal();
});
document.getElementById('curSel').addEventListener('change', e => { cur = e.target.value; try { localStorage.setItem('tm_cur', cur); } catch(_){} render(); });

const modal = document.getElementById('modal');
function openModal(prod, sty){ curProd = PRODS.some(p=>p[0]===prod) ? prod : 'book'; document.getElementById('fProd').value = curProd; syncForm(); if (sty) document.getElementById('fStyle').value = sty; document.getElementById('formBody').hidden = false; document.getElementById('formDone').hidden = true; document.getElementById('fCover').hidden = true; document.getElementById('fErr').hidden = true; modal.hidden = false; setTimeout(()=>document.getElementById('fName').focus(), 30); }
function closeModal(){ modal.hidden = true; }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !modal.hidden) closeModal(); });
const fPhotos = document.getElementById('fPhotos');
function updateSel(){ const n = fPhotos.files ? fPhotos.files.length : 0; document.getElementById('fSel').textContent = n ? t('f_sel').replace('{n}', n) : ''; }
fPhotos.addEventListener('change', () => {
  const th = document.getElementById('thumbs'); th.innerHTML = '';
  [...fPhotos.files].slice(0, 8).forEach(f => { const r = new FileReader(); r.onload = () => { const i = new Image(); i.src = r.result; i.alt = ''; th.appendChild(i); }; r.readAsDataURL(f); });
  updateSel();
});
const API = (document.querySelector('meta[name="talemir-api"]') || {}).content || '';
async function apiUp(){ try { const c = new AbortController(); setTimeout(()=>c.abort(), 3000);
  const r = await fetch(API + '/api/health', {cache:'no-store', signal:c.signal}); return r.ok; } catch(e){ return false; } }
function showDone(h, p){ document.getElementById('formBody').hidden = true; document.getElementById('formDone').hidden = false;
  const H = document.getElementById('fDoneH'), P = document.getElementById('fDoneP');
  H.dataset.i = h; H.textContent = t(h); P.hidden = !p; if (p) { P.dataset.i = p; P.textContent = t(p); } }
function showErr(k){ const e = document.getElementById('fErr'); e.dataset.i = k; e.textContent = t(k); e.hidden = false; }
async function poll(token, until){
  try { const r = await fetch(API + '/api/orders/' + encodeURIComponent(token), {cache:'no-store'}); const s = await r.json();
    if (s.status === 'cover_ready' && s.cover) { const im = document.getElementById('fCover'); im.src = API + s.cover; im.alt = t('f_ready'); im.hidden = false; showDone('f_ready', ''); return; }
    if (s.status === 'in_review') { showDone('f_done_h', 'f_review'); return; }
  } catch(e){}
  if (Date.now() < until) setTimeout(() => poll(token, until), 5000); else showDone('f_done_h', 'f_review');
}
document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault();
  const needPh = ['book','clip','live'].includes(curProd);
  const ok = document.getElementById('fName').value.trim() && (!needPh || (fPhotos.files.length && document.getElementById('fConsent').checked));
  if (!ok) { showErr('f_err'); return; }
  document.getElementById('fErr').hidden = true;
  if (curProd !== 'book') { showDone('f_done_h', 'f_done2'); return; }   // прототип: песни, клипы и поздравления пока не принимаются
  if (!(await apiUp())) { document.getElementById('fCover').hidden = true; showDone('f_done_h', 'f_done'); return; }   // прототип без сервера
  const fd = new FormData();
  fd.append('child_name', document.getElementById('fName').value.trim());
  fd.append('child_age', document.getElementById('fAge').value || '5');
  fd.append('book_lang', document.getElementById('fLang').value);
  fd.append('style', document.getElementById('fStyle').value);
  fd.append('contact', document.getElementById('fContact').value.trim());
  fd.append('consent', 'true'); fd.append('site_lang', lang);
  [...fPhotos.files].slice(0, 8).forEach(f => fd.append('photos', f, f.name));
  const btn = e.submitter; if (btn) btn.disabled = true;
  showDone('f_done_h', 'f_sending');
  try {
    const r = await fetch(API + '/api/orders', {method:'POST', body:fd});
    const j = await r.json().catch(() => ({}));
    if (r.status === 201) { try { localStorage.setItem('tm_order', j.token); } catch(_){} showDone('f_done_h', 'f_wait'); poll(j.token, Date.now() + 10*60*1000); return; }
    document.getElementById('formBody').hidden = false; document.getElementById('formDone').hidden = true;
    const d = String(j.detail || '');
    showErr(d === 'bad_contact' ? 'f_contact_err' : /image|photo/.test(d) ? 'f_photo_err' : 'f_err');
  } catch(err) {
    document.getElementById('formBody').hidden = false; document.getElementById('formDone').hidden = true; showErr('f_neterr');
  } finally { if (btn) btn.disabled = false; }
});
render();
</script>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a1640">
<title>Мои подарки — Talemir</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#2a1640; --surface:#3a2152; --deep:#1d0f2c; --gold:#e7c56e; --gold2:#f3dc9a;
  --plum:#7b2d5b; --text:#f6ebdd; --muted:#d9c8e2; --line:rgba(231,197,110,.18);
  --ok:#7fd1a3; --warn:#f0b35a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--deep);color:var(--text);font-family:Nunito,system-ui,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.app{height:100vh;height:100dvh;display:flex;max-width:1180px;margin:0 auto;background:var(--bg);overflow:hidden;position:relative}
/* ---------- list pane ---------- */
.list{width:100%;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--bg)}
.top{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(145deg,var(--gold2),var(--gold));display:grid;place-items:center;color:var(--deep);font:700 24px 'Cormorant Garamond',serif;box-shadow:0 4px 14px rgba(231,197,110,.25)}
.top h1{font:700 24px 'Cormorant Garamond',serif;margin:0;flex:1;letter-spacing:.3px}
.tabicon{position:relative}
.newbtn{background:linear-gradient(145deg,var(--gold2),var(--gold));color:var(--deep);font-weight:800;border-radius:999px;padding:9px 14px;font-size:14px;position:relative;overflow:hidden}
.newbtn:active{transform:scale(.96)}
.search{margin:10px 16px 6px;background:var(--deep);border-radius:12px;padding:10px 12px;color:var(--muted);font-size:14px;display:flex;gap:8px;align-items:center}
.items{overflow-y:auto;flex:1;padding:4px 0 20px}
.item{display:flex;gap:12px;padding:10px 16px;align-items:center;cursor:pointer;transition:background .15s;position:relative}
.item:hover{background:rgba(255,255,255,.04)}
.item.active{background:rgba(231,197,110,.10)}
.item:active{background:rgba(231,197,110,.14)}
.thumb{width:54px;height:54px;border-radius:16px;flex:none;display:grid;place-items:center;position:relative;box-shadow:0 6px 14px rgba(0,0,0,.35)}
.thumb svg{width:30px;height:30px}
.thumb svg.ring{position:absolute;inset:-4px;width:62px;height:62px}
.meta{flex:1;min-width:0}
.row1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.name{font-weight:800;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{font-size:12px;color:var(--muted);flex:none}
.row2{display:flex;justify-content:space-between;gap:8px;margin-top:3px;align-items:center}
.last{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font-size:11.5px;font-weight:800;border-radius:999px;padding:3px 8px;flex:none;white-space:nowrap}
.chip.ready{background:rgba(127,209,163,.16);color:var(--ok)}
.chip.prog{background:rgba(231,197,110,.16);color:var(--gold)}
.chip.wait{background:rgba(240,179,90,.16);color:var(--warn)}
.chip.pay{background:rgba(123,45,91,.55);color:#ffd6ea}
.promo{display:flex;gap:12px;align-items:center;text-align:left;margin:4px 12px 4px;padding:10px 12px;border-radius:16px;background:linear-gradient(120deg,rgba(231,197,110,.22),rgba(123,45,91,.55));border:1px solid rgba(231,197,110,.45);position:relative;overflow:hidden}
.promo::after{content:"";position:absolute;top:0;left:-40%;width:30%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.18),transparent);transform:skewX(-20deg);animation:shine 6s infinite}
.promo:active{transform:scale(.98)}
.promo .pi{width:40px;height:40px;border-radius:12px;background:linear-gradient(145deg,var(--gold2),var(--gold));display:grid;place-items:center;font-size:20px;flex:none;animation:wig 3s infinite}
@keyframes wig{0%,85%,100%{transform:none}90%{transform:rotate(-10deg)}95%{transform:rotate(10deg)}}
.promo .pt{flex:1;min-width:0}.promo b{display:block;font-size:14.5px;color:var(--gold2)}.promo small{display:block;font-size:12.5px;color:var(--muted)}
.promo .px{width:28px;height:28px;display:grid;place-items:center;border-radius:50%;color:var(--muted);font-size:13px;flex:none}
.promo .px:hover{background:rgba(255,255,255,.08)}
.prow{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;background:var(--deep);margin-bottom:8px;font-size:14px}
.prow .thumb{width:40px;height:40px;border-radius:12px}.prow .thumb svg{width:22px;height:22px}
.count{display:flex;gap:8px;justify-content:center;margin:6px 0 12px}.count div{background:var(--deep);border-radius:12px;padding:8px 10px;text-align:center;min-width:58px}.count b{display:block;font:700 24px 'Cormorant Garamond',serif;color:var(--gold2)}.count span{font-size:11px;color:var(--muted)}
.fund{margin:8px 16px 0;padding:12px 14px;border-radius:14px;background:linear-gradient(135deg,rgba(123,45,91,.45),rgba(58,33,82,.8));font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center;border:1px solid var(--line)}
.fund b{color:var(--text)}
/* ---------- chat pane ---------- */
.chat{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:5}
.chat.open{transform:none}
.chat-bg{position:absolute;inset:0;pointer-events:none;opacity:.07;background-image:radial-gradient(circle at 20% 30%,var(--gold) 1.2px,transparent 1.6px),radial-gradient(circle at 70% 80%,var(--gold) 1px,transparent 1.4px);background-size:46px 46px,62px 62px}
.chead{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);background:rgba(29,15,44,.6);backdrop-filter:blur(8px);position:relative;z-index:2}
.back{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:22px}
.chead .thumb{width:40px;height:40px;border-radius:12px}
.chead .thumb svg{width:22px;height:22px}
.ctitle{flex:1;min-width:0}
.ctitle b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctitle span{font-size:12px;color:var(--muted)}
.helpbtn{border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:7px 12px;font-weight:800;font-size:13px;display:flex;gap:6px;align-items:center}
.helpbtn:hover{background:rgba(231,197,110,.1)}
.msgs{flex:1;overflow-y:auto;padding:14px 12px 10px;display:flex;flex-direction:column;gap:8px;position:relative;z-index:1;scroll-behavior:smooth}
.day{align-self:center;font-size:12px;color:var(--muted);background:rgba(29,15,44,.7);padding:4px 10px;border-radius:999px;margin:6px 0}
.m{max-width:82%;padding:9px 12px 7px;border-radius:16px;font-size:14.5px;line-height:1.4;position:relative;animation:pop .25s ease-out}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.m .t{display:block;text-align:right;font-size:11px;color:var(--muted);margin-top:3px}
.in{align-self:flex-start;background:var(--surface);border-bottom-left-radius:6px}
.out{align-self:flex-end;background:linear-gradient(145deg,#5a2d6e,var(--plum));border-bottom-right-radius:6px}
.who{display:flex;gap:8px;align-items:flex-end;align-self:flex-start;max-width:88%}
.who .m{max-width:100%}
.mira{width:30px;height:30px;flex:none;border-radius:50%;background:#f3dc9a;overflow:hidden}
.photos{display:grid;grid-template-columns:repeat(3,64px);gap:4px;margin-bottom:4px}
.ph{width:64px;height:64px;border-radius:10px;background:linear-gradient(160deg,#6b4a8a,#3a2152);display:grid;place-items:center;font-size:22px}
.card{align-self:stretch;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;animation:pop .25s ease-out}
.card h4{margin:0 0 8px;font:700 19px 'Cormorant Garamond',serif;color:var(--gold2)}
.bar{height:8px;background:var(--deep);border-radius:99px;overflow:hidden;margin:6px 0 10px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:99px;transition:width .6s}
.steps{list-style:none;padding:0;margin:0;font-size:13.5px;color:var(--muted)}
.steps li{display:flex;gap:8px;align-items:center;padding:3px 0}
.steps li.done{color:var(--text)}
.steps li.now{color:var(--gold)}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted);flex:none;display:grid;place-items:center;font-size:10px}
li.done .dot{background:var(--ok);border-color:var(--ok);color:var(--deep)}
li.now .dot{border-color:var(--gold);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(231,197,110,.25)}}
.video{aspect-ratio:9/12;max-height:300px;border-radius:14px;background:radial-gradient(circle at 50% 35%,#7b2d5b,#1d0f2c 75%);display:grid;place-items:center;position:relative;overflow:hidden;margin-bottom:10px;width:100%}
.video .play{width:62px;height:62px;border-radius:50%;background:rgba(243,220,154,.92);display:grid;place-items:center;color:var(--deep);font-size:24px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.video .cap{position:absolute;bottom:12px;left:0;right:0;text-align:center;font:700 22px 'Cormorant Garamond',serif;color:var(--gold2);text-shadow:0 2px 10px rgba(0,0,0,.6)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{border-radius:12px;padding:10px 14px;font-weight:800;font-size:14px;min-height:44px}
.gold{background:linear-gradient(145deg,var(--gold2),var(--gold));color:var(--deep);position:relative;overflow:hidden}
.gold::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 5s infinite}
@keyframes shine{0%,80%{left:-60%}100%{left:130%}}
.gold:active{transform:scale(.97)}
.ghost{border:1px solid var(--line);color:var(--text);background:rgba(255,255,255,.03)}
.ghost:hover{border-color:var(--gold)}
.sys{align-self:center;font-size:12.5px;color:var(--muted);text-align:center;max-width:90%;background:rgba(29,15,44,.55);padding:6px 12px;border-radius:12px}
.sys b{color:var(--gold)}
/* ---------- composer ---------- */
.comp{display:flex;align-items:flex-end;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(29,15,44,.75);position:relative;z-index:2}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--muted);transition:color .15s,background .15s}
.ib:hover{color:var(--gold)}
.field{flex:1;background:var(--surface);border-radius:22px;padding:11px 14px;min-height:44px;max-height:120px;overflow-y:auto;outline:none;font-size:15px;line-height:1.35;border:1px solid transparent}
.field:focus{border-color:var(--line)}
.field:empty::before{content:attr(data-ph);color:#a993b8;pointer-events:none}
.send{background:var(--gold);color:var(--deep)}
.swap{animation:swap .18s ease-out}
@keyframes swap{from{transform:scale(.4) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}
.rec{position:absolute;inset:0;display:none;align-items:center;gap:10px;padding:0 16px;background:var(--deep);font-size:14px}
.rec.on{display:flex}
.rdot{width:10px;height:10px;border-radius:50%;background:#ff5c7a;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.rec .hint{flex:1;color:var(--muted);text-align:center}
.lockbadge{position:absolute;right:14px;bottom:62px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:8px 10px;font-size:12px;color:var(--muted);display:none;text-align:center}
.lockbadge.on{display:block}
.micbig{transform:scale(1.35);background:var(--gold)!important;color:var(--deep)!important}
.voice{display:flex;align-items:center;gap:8px}
.wave{display:flex;gap:2px;align-items:center;height:22px}
.wave i{width:3px;background:var(--gold2);border-radius:2px}
/* ---------- sheets & modals ---------- */
.shade{position:absolute;inset:0;background:rgba(10,4,18,.62);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.shade.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;background:var(--surface);border-radius:22px 22px 0 0;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:21;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.45)}
.sheet.on{transform:none}
.grab{width:42px;height:5px;border-radius:9px;background:rgba(255,255,255,.25);margin:8px auto 4px}
.sh-h{padding:6px 18px 10px;border-bottom:1px solid var(--line)}
.sh-h h3{margin:0;font:700 22px 'Cormorant Garamond',serif;color:var(--gold2)}
.sh-h p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.sh-b{padding:14px 18px 18px;overflow-y:auto;flex:1}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px;border-radius:14px;border:1px solid var(--line);margin-bottom:8px;background:rgba(0,0,0,.12)}
.opt:hover{border-color:var(--gold)}
.opt .ic{width:36px;height:36px;border-radius:10px;background:var(--deep);display:grid;place-items:center;font-size:18px;flex:none}
.opt small{display:block;color:var(--muted);font-size:12.5px}
.opt.sel{border-color:var(--gold);background:rgba(231,197,110,.08)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.qc{border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700}
.qc:hover{background:rgba(231,197,110,.1)}
.note{font-size:12.5px;color:var(--muted);margin-top:8px}
.tl{display:flex;align-items:center;gap:10px;margin:10px 0}
.tl input{flex:1;accent-color:var(--gold)}
.ta{width:100%;background:var(--deep);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:10px;font:inherit;font-size:14px;min-height:64px;resize:vertical}
.verdict{border-radius:14px;padding:12px;margin-top:10px;font-size:14px;line-height:1.45}
.verdict.ok{background:rgba(127,209,163,.12);border:1px solid rgba(127,209,163,.35)}
.verdict.no{background:rgba(240,179,90,.10);border:1px solid rgba(240,179,90,.35)}
.supp{display:flex;flex-direction:column;height:100%}
.supp .msgs{background:var(--bg);border-radius:14px;padding:10px;min-height:200px}
.ctx{display:flex;gap:10px;align-items:center;background:var(--deep);padding:8px 10px;border-radius:12px;font-size:12.5px;color:var(--muted);margin-bottom:8px}
.ctx b{color:var(--text)}
.modal{position:absolute;left:50%;top:50%;width:min(380px,92%);transform:translate(-50%,-46%) scale(.96);opacity:0;pointer-events:none;transition:all .22s;background:var(--surface);border-radius:22px;padding:20px;z-index:22;border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.modal h3{margin:0 0 4px;font:700 24px 'Cormorant Garamond',serif;color:var(--gold2)}
.sum{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px}
.cards{display:flex;gap:8px;margin:14px 0}
.cards div{flex:1;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:12.5px;text-align:center;color:var(--muted)}
.cards div.sel{border-color:var(--gold);color:var(--text)}
/* heart flight */
.heart{position:fixed;z-index:50;font-size:28px;pointer-events:none;filter:drop-shadow(0 4px 10px rgba(255,92,122,.6))}
.glow{animation:glow 1.4s ease-out}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(231,197,110,.9)}100%{box-shadow:0 0 0 18px rgba(231,197,110,0)}}
.kiss{align-self:center;display:flex;flex-direction:column;align-items:center;gap:6px;animation:pop .3s}
.kiss .big{width:92px;height:92px;border-radius:50%;background:#f3dc9a;overflow:hidden;box-shadow:0 10px 30px rgba(231,197,110,.35)}
.toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-200%);visibility:hidden;background:var(--deep);border:1px solid var(--gold);color:var(--text);padding:10px 14px;border-radius:12px;font-size:13.5px;z-index:60;transition:transform .3s;max-width:90%;text-align:center}
.toast.on{transform:translate(-50%,0);visibility:visible}
.empty{flex:1;display:none;place-items:center;text-align:center;color:var(--muted);padding:30px}
.proto{margin:2px 16px 0;align-self:flex-start;font-size:11px;color:var(--muted);background:rgba(29,15,44,.85);border:1px solid var(--line);padding:4px 8px;border-radius:8px}
/* ---------- desktop ---------- */
@media (min-width:860px){
  body{padding:18px}
  .app{height:calc(100vh - 36px);border-radius:20px;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.5)}
  .list{width:360px;flex:none}
  .chat{position:relative;transform:none;flex:1;transition:none}
  .chat:not(.open){display:none}
  .empty.show{display:grid}
  .back{display:none}
  .sheet{left:50%;right:auto;bottom:50%;width:440px;border-radius:22px;transform:translate(-50%,60%) scale(.97);opacity:0;pointer-events:none;transition:all .22s}
  .sheet.on{transform:translate(-50%,50%);opacity:1;pointer-events:auto}
  .grab{display:none}
}
.info{display:none}
@media (min-width:1200px){
  .app{max-width:1440px}
  .info{display:flex;flex-direction:column;width:330px;flex:none;border-left:1px solid var(--line);background:linear-gradient(180deg,rgba(58,33,82,.55),var(--bg));overflow-y:auto;padding:18px}
  .info.hide{display:none}
  .scene{height:210px;border-radius:20px;display:grid;place-items:center;position:relative;overflow:hidden;box-shadow:inset 0 -30px 60px rgba(0,0,0,.25)}
  .scene svg{width:84px;height:84px;filter:drop-shadow(0 14px 18px rgba(0,0,0,.35))}
  .scene::after{content:"";position:absolute;bottom:22px;width:120px;height:16px;border-radius:50%;background:rgba(0,0,0,.25);filter:blur(6px)}
  .info h2{font:700 26px 'Cormorant Garamond',serif;margin:14px 0 2px;color:var(--gold2);line-height:1.1}
  .info .num{font-size:12.5px;color:var(--muted)}
  .info h5{margin:18px 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .tline{list-style:none;margin:0;padding:0 0 0 4px}
  .tline li{position:relative;padding:0 0 14px 22px;font-size:13.5px;color:var(--muted)}
  .tline li::before{content:"";position:absolute;left:0;top:3px;width:12px;height:12px;border-radius:50%;border:2px solid var(--muted)}
  .tline li::after{content:"";position:absolute;left:6px;top:17px;bottom:0;width:2px;background:var(--line)}
  .tline li:last-child::after{display:none}
  .tline li.done{color:var(--text)}.tline li.done::before{background:var(--ok);border-color:var(--ok)}
  .tline li.now{color:var(--gold)}.tline li.now::before{border-color:var(--gold);animation:pulse 1.2s infinite}
  .files div{display:flex;justify-content:space-between;padding:8px 10px;background:var(--deep);border-radius:10px;margin-bottom:6px;font-size:13px}
  .files span{color:var(--muted)}
  .info .acts .btn{flex:1}
  .minipromo{margin-top:auto;padding:12px;border-radius:14px;background:linear-gradient(120deg,rgba(231,197,110,.18),rgba(123,45,91,.45));border:1px solid rgba(231,197,110,.35);font-size:13px;color:var(--muted);cursor:pointer}
  .minipromo b{color:var(--gold2)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.login{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
.lbox{width:min(400px,100%);text-align:center}
.lbox .big{width:96px;height:96px;border-radius:50%;margin:0 auto 12px;overflow:hidden;background:#f3dc9a;box-shadow:0 10px 30px rgba(231,197,110,.35)}
.lbox h2{font:700 30px 'Cormorant Garamond',serif;color:var(--gold2);margin:6px 0}
.lbox p{color:var(--muted);font-size:14.5px;margin:4px 0 16px}
.lbox .btn{width:100%;margin-bottom:10px;display:block;text-align:center;text-decoration:none}
.inp{width:100%;background:var(--deep);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:13px 14px;font:inherit;font-size:16px;margin-bottom:10px;outline:none}
.inp:focus{border-color:var(--gold)}
.err{color:var(--warn);font-size:13px;min-height:18px;margin:4px 0}
.link{color:var(--gold);text-decoration:underline;font-size:13.5px;background:none}

<body>

      <a href="https://ru.api.talemir.com/cabinet">🎁 Бонусы, друзья и настройки</a>

    <div class="items" id="items"></div>

  <section class="chat" id="chat">

  <div class="toast" id="toast"></div>
</div>

<script>
(function(){
const EMBED=/[?&]embed=1/.test(location.search);
if(EMBED){document.documentElement.classList.add('embed');const b=document.createElement('base');b.target='_top';document.head.appendChild(b)}
const API='https://ru.api.talemir.com';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(path,opt){
  opt=opt||{}; const o={credentials:'include',headers:{'Accept':'application/json'}};
  if(opt.body){o.method='POST';o.headers['Content-Type']='application/json';o.body=JSON.stringify(opt.body)}
  const r=await fetch(API+path,o); let j=null; try{j=await r.json()}catch(e){}
  if(!r.ok){const e=new Error((j&&j.detail)||('http_'+r.status));e.status=r.status;throw e}
  return j;
}
const MIRA=`<svg viewBox="0 0 64 64"><rect width="64" height="64" fill="#f3dc9a"/><circle cx="32" cy="36" r="17" fill="#f6d2b8"/><path d="M14 34c0-14 8-22 18-22s18 8 18 22c-3-6-8-10-18-10S17 28 14 34z" fill="#5a3320"/><circle cx="25.5" cy="37" r="2.4" fill="#2a1640"/><circle cx="38.5" cy="37" r="2.4" fill="#2a1640"/><path d="M27 44q5 4 10 0" stroke="#b34a6a" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="21" cy="42" r="2.6" fill="#f2a3b3" opacity=".6"/><circle cx="43" cy="42" r="2.6" fill="#f2a3b3" opacity=".6"/><path d="M45 16l3-5 1 6z" fill="#e7c56e"/></svg>`;
const IC={
 ded:`<svg viewBox="0 0 24 24" fill="none" stroke="#1d0f2c" stroke-width="1.8" stroke-linecap="round"><path d="M5 11l7-7 7 7"/><path d="M6 11h12v2a6 6 0 01-12 0z" fill="#fff"/><circle cx="12" cy="3.5" r="1.3" fill="#fff"/></svg>`,
 song:`<svg viewBox="0 0 24 24" fill="none" stroke="#1d0f2c" stroke-width="1.8" stroke-linecap="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>`,
 book:`<svg viewBox="0 0 24 24" fill="none" stroke="#1d0f2c" stroke-width="1.8" stroke-linejoin="round"><path d="M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2z"/><path d="M4 21V5M9 7h6"/></svg>`,
 video:`<svg viewBox="0 0 24 24" fill="none" stroke="#1d0f2c" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3z"/></svg>`,
 photo:`<svg viewBox="0 0 24 24" fill="none" stroke="#1d0f2c" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="12" cy="12" r="3.5"/></svg>`,
 card:`<svg viewBox="0 0 24 24" fill="none" stroke="#1d0f2c" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 14h8"/></svg>`,
 paw:`<svg viewBox="0 0 24 24" fill="#1d0f2c"><circle cx="7" cy="9" r="2"/><circle cx="12" cy="6.5" r="2"/><circle cx="17" cy="9" r="2"/><path d="M7.5 17c0-3 2-5 4.5-5s4.5 2 4.5 5c0 1.5-1.5 2-2.5 1.6-1.3-.5-2.7-.5-4 0C9 19 7.5 18.5 7.5 17z"/></svg>`,
 gift:`<svg viewBox="0 0 24 24" fill="none" stroke="#1d0f2c" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="9" width="18" height="11" rx="1.5"/><path d="M3 13h18M12 9v11M12 9c-2-4-6-4-6-1.5S10 9 12 9zm0 0c2-4 6-4 6-1.5S14 9 12 9z"/></svg>`
};
const BGS={ded:'linear-gradient(145deg,#f7d9d9,#e7c56e)',song:'linear-gradient(145deg,#f3dc9a,#e7a96e)',book:'linear-gradient(145deg,#e6d6f5,#e7c56e)',video:'linear-gradient(145deg,#e7c56e,#c98bb0)',photo:'linear-gradient(145deg,#f3dc9a,#b9a3e6)',card:'linear-gradient(145deg,#fbe6c8,#e7c56e)',paw:'linear-gradient(145deg,#f3dc9a,#d8c1a0)',gift:'linear-gradient(145deg,#f3dc9a,#e7c56e)'};
/* название, иконка, варианты правки (правило собственника 17.11: у Деда Мороза нет «не похож» и замены фото) */
const P={
 ny:{t:'Поздравление от Деда Мороза',i:'ded',redo:['name','stress','tech']},
 song:{t:'Песня с именем',i:'song',redo:['name','stress','tech']},
 clip:{t:'Видеоклип',i:'video',redo:['name','stress','tech']},
 book:{t:'Книга-сказка',i:'book',redo:['nameText','face','tech']},
 live:{t:'Живая сказка',i:'video',redo:['nameText','face','tech']},
 cartoon:{t:'Мультфильм',i:'video',redo:['nameText','face','tech']},
 photoshoot:{t:'Фотосессия',i:'photo',redo:['face','tech']},
 inv:{t:'Приглашение на праздник',i:'card',redo:['nameText','tech']},
 invkit:{t:'Набор праздника',i:'card',redo:['nameText','tech']},
 pet_live:{t:'Живое фото питомца',i:'paw',redo:['petFace','tech']},
 pet_sing:{t:'Поющий питомец',i:'paw',redo:['name','stress','tech']},
 preg:{t:'Малыш по УЗИ',i:'photo',redo:['tech']}
};
const REDO={name:['name','✍️','Имя написано или звучит не так','проверим по вашей анкете'],nameText:['name','✍️','Ошибка в имени','проверим по вашей анкете'],
 stress:['stress','🔊','Неверное ударение','отметьте момент'],face:['face','🙂','Герой не похож','сравним с фото из заказа'],petFace:['face','🐾','Питомец не похож','сравним с фото из заказа'],
 tech:['tech','⚙️','Технический сбой','звук, картинка, файл не открывается']};
const MEDIA_KINDS=['ny','song','clip','live','cartoon','pet_live','pet_sing'];
function prod(o){return P[o.product]||{t:'Подарок',i:'gift',redo:['tech']}}
function title(o){const p=prod(o);return p.t+(o.hero?' — '+o.hero:'')}
const ST={ready:['готово ✓','ready'],rework:['дорабатываем','prog'],in_work:['готовится','prog'],quality:['проверяем','prog'],paid:['оплачен','prog'],queued:['в очереди','wait'],wish_fix:['нужно ваше действие','pay'],heroes:['утвердите героев','pay'],wait:['ждёт оплаты','pay']};
function stage(o){return o.stage||o.status}
function pct(o){if(stage(o)==='ready')return 100;if(o.eta_min&&o.elapsed!=null){return Math.max(5,Math.min(95,Math.round(o.elapsed/(o.eta_min*60)*100)))}return null}
function chip(o){const s=ST[stage(o)]||['в работе','prog'];const p=pct(o);return `<span class="chip ${s[1]}">${s[1]==='prog'&&p!=null?'готовится '+p+'%':s[0]}</span>`}
function ring(o){const p=pct(o);if(p==null||p>=100||(ST[stage(o)]||[])[1]!=='prog')return '';const c=2*Math.PI*29;return `<svg class="ring" viewBox="0 0 62 62"><circle cx="31" cy="31" r="29" fill="none" stroke="rgba(231,197,110,.2)" stroke-width="3"/><circle cx="31" cy="31" r="29" fill="none" stroke="#e7c56e" stroke-width="3" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p/100)}" transform="rotate(-90 31 31)"/></svg>`}
function lastLine(o){const s=stage(o);
 if(s==='ready')return o.expired?'Срок хранения файлов истёк':'Готово ✨ Откройте и поделитесь';
 if(s==='wish_fix')return 'Нужно изменить пожелание';
 if(s==='heroes')return 'Посмотрите героев и утвердите';
 if(s==='rework')return 'Дорабатываем — пришлём сюда';
 if(s==='queued')return 'Оплачен, в очереди';
 if(s==='quality')return 'Проверяем качество';
 return 'Создаём ваш подарок'+(o.eta?' · '+o.eta.replace(/^Обычно\s*—\s*/,''):'')}
function dshow(d){if(!d)return '';const t=new Date(d+'T12:00:00');const now=new Date();if(t.toDateString()===now.toDateString())return 'сегодня';const y=new Date(now-864e5);if(t.toDateString()===y.toDateString())return 'вчера';return t.toLocaleDateString('ru-RU',{day:'numeric',month:'short'})}

let orders=[],cur=null,me=null;
function renderList(){
 const el=$('#items');
 if(!orders.length){el.innerHTML=`<div class="emptybox"><div style="font-size:40px">🎁</div><p>Здесь будут ваши подарки — каждый в своём чате, как в мессенджере.</p><a class="btn gold" href="https://talemir.com/#products">Создать подарок</a></div>`;return}
 el.innerHTML=orders.map(o=>{const p=prod(o);return `<div class="item ${cur&&cur.num===o.num?'active':''}" data-n="${esc(o.num)}" role="button" tabindex="0">
  <div class="thumb" style="background:${BGS[p.i]}">${IC[p.i]}${ring(o)}</div>
  <div class="meta"><div class="row1"><span class="name">${esc(title(o))}</span><span class="time">${dshow(o.date)}</span></div>
  <div class="row2"><span class="last">${esc(lastLine(o))}</span>${chip(o)}</div></div></div>`}).join('');
 el.querySelectorAll('.item').forEach(n=>{n.onclick=()=>openChat(n.dataset.n);n.onkeydown=e=>{if(e.key==='Enter')openChat(n.dataset.n)}});
 renderInfo();
}
function add(h){const m=$('#msgs');m.insertAdjacentHTML('beforeend',h);requestAnimationFrame(()=>m.scrollTop=m.scrollHeight);return m.lastElementChild}
function mira(t){return add(`<div class="who"><div class="mira">${MIRA}</div><div class="m in">${t}<span class="t">${hhmm()}</span></div></div>`)}
function meMsg(t){return add(`<div class="m out">${t}<span class="t">${hhmm()} ✓</span></div>`)}
function sys(t){return add(`<div class="sys">${t}</div>`)}
function hhmm(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function steps(o){const s=stage(o);const L=['Оплачено','Создаём подарок','Проверяем качество','Готово'];
 const i={paid:1,queued:1,in_work:1,rework:1,heroes:1,wish_fix:1,quality:2,ready:4}[s]??1;
 return L.map((t,k)=>`<li class="${k<i?'done':k===i?'now':''}"><span class="dot">${k<i?'✓':''}</span>${k===1&&s==='rework'?'Дорабатываем':t}</li>`).join('')}
function fileUrl(f){return /^https?:/.test(f)?f:API+f}
function ext(f){const m=String(f).toLowerCase().match(/\.([a-z0-9]{2,4})(?:$|\?)/);return m?m[1]:''}
function resultCard(o){
 if(o.expired)return add(`<div class="card"><h4>Подарок был готов</h4><p class="note" style="margin-top:0">Файлы хранятся 30 дней после выдачи — этот срок прошёл. Напишите в «Помощь», если нужно восстановить.</p></div>`);
 const fs=(o.files||[]).map(fileUrl);
 let media='';const v=fs.find(f=>['mp4','mov','webm'].includes(ext(f)));const a=fs.find(f=>['mp3','m4a','wav','ogg'].includes(ext(f)));const im=fs.find(f=>['jpg','jpeg','png','webp'].includes(ext(f)));
 if(v)media=`<video class="media" src="${esc(v)}" controls playsinline preload="metadata"></video>`;
 else if(a)media=`<audio class="media" src="${esc(a)}" controls preload="none"></audio>`;
 else if(im)media=`<img class="media" src="${esc(im)}" alt="Ваш подарок" style="object-fit:contain">`;
 const btns=fs.map((f,k)=>`<a class="btn ${k?'ghost':'gold'}" href="${esc(f)}" target="_blank" rel="noopener">Скачать${fs.length>1?' '+(ext(f)||'файл').toUpperCase():''}</a>`).join('');
 return add(`<div class="card">${media}<div class="dl">${btns||''}<a class="btn ghost" href="${esc(API+o.link)}" target="_blank" rel="noopener">Страница заказа</a><button class="btn ghost" id="redoBtn">Нужна правка</button></div>
  ${o.keep_until?`<p class="note">Файлы хранятся до ${esc(new Date(o.keep_until).toLocaleDateString('ru-RU'))} — скачайте себе.</p>`:''}<p class="note">Не понравилось или ошибка в имени — переделаем бесплатно.</p></div>`);
}
function openChat(n){
 const o=orders.find(x=>x.num===n);if(!o)return;cur=o;
 const p=prod(o);$('#cThumb').style.background=BGS[p.i];$('#cThumb').innerHTML=IC[p.i];
 $('#cName').textContent=title(o);$('#cSub').textContent='Заказ № '+o.num+' · '+((ST[stage(o)]||['в работе'])[0]);
 $('#msgs').innerHTML='';$('#empty').classList.remove('show');$('#chat').classList.add('open');document.body.classList.add('in-chat');
 add(`<div class="day">${o.date?new Date(o.date+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long'}):''}</div>`);
 mira(`Это чат вашего подарка «${esc(p.t)}»${o.hero?'. Главный герой — '+esc(o.hero):''} 💫 Здесь видно, как он готовится, а когда будет готов — он появится прямо тут.`);
 sys(`Заказ № <b>${esc(o.num)}</b> оплачен`);
 const s=stage(o);
 if(s==='ready'){mira('Ваш подарок готов! ✨ Смотрите, скачивайте и делитесь.');resultCard(o)}
 else if(s==='wish_fix'||s==='heroes'){
  mira(s==='heroes'?'Мы нарисовали героев — посмотрите и утвердите, после этого создадим подарок.':'Нам нужно ваше участие: пожелание стоит немного изменить. Это займёт минуту.');
  add(`<div class="card"><div class="acts"><a class="btn gold" href="${esc(API+o.link)}" target="_blank" rel="noopener">${s==='heroes'?'Посмотреть героев':'Открыть и изменить'}</a></div></div>`);
 } else {
  const pc=pct(o);
  add(`<div class="card"><h4>${s==='rework'?'Дорабатываем подарок':s==='queued'?'Подарок в очереди':'Готовим подарок'}</h4>
   ${pc!=null?`<div style="display:flex;justify-content:space-between;font-size:13px;color:var(--muted)"><span>Готово <b style="color:var(--gold)">${pc}%</b></span></div><div class="bar"><i style="width:${pc}%"></i></div>`:''}
   <ul class="steps">${steps(o)}</ul>${o.eta?`<p class="note">${esc(o.eta)}</p>`:''}
   <p class="note">Пришлём сюда, на почту и в Telegram, как только будет готово. Страницу можно закрыть.</p>
   <div class="acts" style="margin-top:8px"><a class="btn ghost" href="${esc(API+o.link)}" target="_blank" rel="noopener">Страница заказа</a></div></div>`);
 }
 const rb=$('#redoBtn');if(rb)rb.onclick=openRedo;
 hint(s==='ready'?'Вопрос по подарку? Напишите':'Спросите что-нибудь — я рядом');
 renderList();
}
function hint(t){$('#field').dataset.ph=t}
$('#back').onclick=()=>{$('#chat').classList.remove('open');document.body.classList.remove('in-chat');cur=null;renderList()};

/* ---- composer: Telegram-like (микрофон → стрелка) ---- */
const MIC=`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>`;
const SEND=`<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4l17.5-7.5a1 1 0 000-1.8L3.4 3.6a.9.9 0 00-1.3 1l2 6.4 9 1-9 1-2 6.4a.9.9 0 001.3 1z"/></svg>`;
const act=$('#act'),field=$('#field');let mode='mic';act.innerHTML=MIC;
function setMode(m){if(m===mode)return;mode=m;act.innerHTML=m==='mic'?MIC:SEND;act.classList.toggle('send',m==='send');act.setAttribute('aria-label',m==='mic'?'Голосовое':'Отправить');act.classList.remove('swap');void act.offsetWidth;act.classList.add('swap')}
field.addEventListener('input',()=>{if(!field.textContent.trim())field.innerHTML='';setMode(field.textContent.trim()?'send':'mic')});
field.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendText()}});
act.onclick=()=>{if(mode==='send')sendText();else toast('Голосовые сообщения скоро — пока напишите текстом 🙏')};
function sendText(){const t=field.textContent.trim();if(!t||!cur)return;field.innerHTML='';setMode('mic');meMsg(esc(t));setTimeout(()=>answer(t,mira,true),500)}
function answer(q,say,offer){
 const o=cur,s=stage(o),low=q.toLowerCase();let a=null;
 if(/где|когда|сколько|долго|готов/.test(low))a=s==='ready'?'Подарок уже готов — он здесь, в чате ✨ А ещё — у вас на почте и в Telegram.':'Подарок готовится'+(pct(o)!=null?' — уже '+pct(o)+'%':'')+'. '+(o.eta?o.eta+' ':'')+'Пришлём сюда сразу, как закончим.';
 else if(/почт|письм|e-?mail/.test(low))a='Письмо уходит сразу, как подарок готов. Загляните в «Спам» и «Промоакции». Если и там нет — нажмите «Помощь» → «Позвать человека».';
 else if(/вернуть|возврат|деньг/.test(low))a='Расскажите, что не так — часто быстрее и лучше переделать. Если нужен возврат — нажмите «Помощь» → «Позвать человека», ответим в течение 24 часов.';
 else if(/исправ|перед|ошиб|не так|не похож|ударен/.test(low))a=s==='ready'?'Нажмите «Нужна правка» под подарком и выберите, что не так — если ошибка наша, переделаем бесплатно.':'Пока подарок готовится, напишите в «Помощь» → «Позвать человека», что изменить — успеем учесть.';
 if(a){say(a);return}
 say('Передаю ваш вопрос команде — ответим в Telegram или на почту в течение 24 часов 💛');
 sendAsk('question','',q,'');
}
async function sendAsk(kind,reason,text,at){try{await api('/api/me/ask',{body:{kind,reason,text,at,num:cur?cur.num:''}});return true}catch(e){toast(e.status===429?'Слишком много обращений — попробуйте через час':'Не получилось отправить. Напишите нам в Telegram @Talemir_bot');return false}}

/* ---- sheets ---- */
function openSheet(h){$('#sheetBody').innerHTML=h;$('#shade').classList.add('on');$('#sheet').classList.add('on')}
function closeAll(){$('#shade').classList.remove('on');$('#sheet').classList.remove('on')}
$('#shade').onclick=closeAll;
$('#helpBtn').onclick=()=>{const o=cur;if(!o)return;const p=prod(o);
 openSheet(`<div class="sh-h"><h3>Помощь</h3><p>Видим ваш заказ — объяснять заново не нужно.</p></div>
 <div class="sh-b supp"><div class="ctx"><div class="thumb" style="width:34px;height:34px;border-radius:10px;background:${BGS[p.i]}">${IC[p.i]}</div><div><b>${esc(title(o))}</b><br>№ ${esc(o.num)} · ${(ST[stage(o)]||['в работе'])[0]}</div></div>
 <div class="chips">${['Где мой подарок?','Не пришло на почту','Хочу что-то исправить','Вернуть деньги'].map(q=>`<button class="qc" data-q="${q}">${q}</button>`).join('')}</div>
 <div class="msgs" id="smsgs"><div class="who"><div class="mira">${MIRA}</div><div class="m in">Здравствуйте! Чем помочь с заказом № ${esc(o.num)}?<span class="t">${hhmm()}</span></div></div></div>
 <div style="display:flex;gap:6px;margin-top:8px"><input id="sin" class="inp" style="margin:0" placeholder="Ваш вопрос" maxlength="1000"><button class="btn gold" id="sgo" aria-label="Отправить">→</button></div>
 <button class="btn ghost" style="margin-top:8px" id="human">Позвать человека</button></div>`);
 const sAdd=h=>{const m=$('#smsgs');m.insertAdjacentHTML('beforeend',h);m.scrollTop=m.scrollHeight};
 const say=t=>sAdd(`<div class="who"><div class="mira">${MIRA}</div><div class="m in">${t}<span class="t">${hhmm()}</span></div></div>`);
 const ask=q=>{if(!q||!q.trim())return;$('#sin').value='';sAdd(`<div class="m out">${esc(q)}<span class="t">${hhmm()} ✓</span></div>`);setTimeout(()=>answer(q,say),400)};
 document.querySelectorAll('#sheetBody .qc').forEach(b=>b.onclick=()=>ask(b.dataset.q));
 $('#sgo').onclick=()=>ask($('#sin').value);$('#sin').onkeydown=e=>{if(e.key==='Enter')ask($('#sin').value)};
 $('#human').onclick=async()=>{const t=$('#sin').value.trim();if(await sendAsk('human','',t,''))sAdd(`<div class="sys">Передали команде вместе с заказом № ${esc(o.num)}. Ответим в Telegram или на почту в течение 24 часов.</div>`);$('#human').disabled=true};
};
function openRedo(){const o=cur;const p=prod(o);
 const opts=p.redo.map(k=>REDO[k]).concat([['other','🎨','Хочу по-другому','одну правку сделаем бесплатно']]);
 openSheet(`<div class="sh-h"><h3>Что исправить?</h3><p>Ошибка наша — переделаем бесплатно.</p></div><div class="sh-b" id="rb">
 ${opts.map(r=>`<button class="opt" data-k="${r[0]}"><span class="ic">${r[1]}</span><span><b>${r[2]}</b><small>${r[3]}</small></span></button>`).join('')}</div>`);
 document.querySelectorAll('#rb .opt').forEach(b=>b.onclick=()=>redoStep(b.dataset.k));
}
function redoStep(k){const o=cur;const rb=$('#rb');const media=MEDIA_KINDS.includes(o.product);
 rb.innerHTML=`<p><b>${k==='other'?'Что хотите изменить?':'Покажите, где ошибка'}</b></p>
 ${media&&k!=='other'&&k!=='face'?`<input class="inp" id="rat" placeholder="Момент в ролике или песне, например 0:12" maxlength="8" inputmode="numeric">`:''}
 <textarea class="ta" id="rtx" maxlength="1000" placeholder="${k==='other'?'Например: сделайте музыку спокойнее':'Опишите коротко, что не так'}"></textarea>
 <div class="acts" style="margin-top:10px"><button class="btn gold" id="rsend">Отправить</button></div>
 <p class="note">${k==='other'?'Одну правку «хочу по-другому» делаем бесплатно. Следующие — по себестоимости, сумму назовём заранее.':'Проверим по вашей анкете. Если ошибка наша — переделаем бесплатно и пришлём новую версию сюда.'}</p>`;
 $('#rsend').onclick=async()=>{const t=$('#rtx').value.trim();if(k==='other'&&!t){$('#rtx').focus();toast('Напишите, что изменить');return}
  $('#rsend').disabled=true;if(await sendAsk('redo',k,t,($('#rat')||{}).value||'')){closeAll();meMsg('Отправила запрос на правку');setTimeout(()=>mira('Приняли! Проверим и ответим здесь, в Telegram или на почту в течение 24 часов 💛'),500)}else $('#rsend').disabled=false};
}

/* ---- desktop info panel ---- */
function renderInfo(){const el=$('#info');const o=cur;if(!o){el.classList.add('hide');return}el.classList.remove('hide');const p=prod(o);
 const s=stage(o);const i={paid:1,queued:1,in_work:1,rework:1,heroes:1,wish_fix:1,quality:2,ready:4}[s]??1;
 el.innerHTML=`<div class="scene" style="background:${BGS[p.i]}">${IC[p.i]}</div><h2>${esc(title(o))}</h2><div class="num">Заказ № ${esc(o.num)} · ${chip(o)}</div>
 <h5>Как идёт</h5><ul class="tline">${['Оплачено','Создаём подарок','Проверяем качество','Готово'].map((t,k)=>`<li class="${k<i||s==='ready'?'done':k===i?'now':''}">${t}</li>`).join('')}</ul>
 ${o.eta&&s!=='ready'?`<p class="note">${esc(o.eta)}</p>`:''}
 <div class="acts" style="margin:14px 0 16px">${s==='ready'&&o.files&&o.files.length&&!o.expired?`<a class="btn gold" href="${esc(fileUrl(o.files[0]))}" target="_blank" rel="noopener" style="text-align:center;text-decoration:none">Скачать</a>`:''}<a class="btn ghost" href="${esc(API+o.link)}" target="_blank" rel="noopener" style="text-align:center;text-decoration:none">Страница заказа</a></div>
 <div class="minipromo" onclick="document.getElementById('helpBtn').click()"><b>💬 Есть вопрос?</b><br>Нажмите — ответим сразу, а если нужно — подключим человека.</div>`}

/* ---- login ---- */
function showLogin(){
 $('#list').style.display='none';$('#empty').classList.remove('show');$('#info').classList.add('hide');const L=$('#login');L.style.display='flex';
 L.innerHTML=`<div class="lbox"><div class="big">${MIRA}</div><h2>Мои подарки</h2><p>Войдите, чтобы видеть свои подарки — каждый в своём чате.</p>
  <button class="btn gold" id="tgGo">Войти через Telegram</button>
  <button class="btn ghost" id="emGo">Войти по почте</button><div class="err" id="lerr"></div>
  <p style="font-size:12px">Без паролей: пришлём одноразовый код.</p></div>`;
 $('#tgGo').onclick=tgFlow;$('#emGo').onclick=emFlow;
}
async function tgFlow(){const L=$('#login .lbox');let r;try{r=await api('/api/auth/tg/start',{body:{}})}catch(e){$('#lerr').textContent=e.status===429?'Слишком много попыток — попробуйте через час.':'Не получилось. Попробуйте ещё раз.';return}
 L.innerHTML=`<div class="big">${MIRA}</div><h2>Код в Telegram</h2><p>1. Откройте бота — он пришлёт код.<br>2. Введите код здесь.</p>
 <a class="btn gold" href="${esc(r.link)}" target="_blank" rel="noopener">Открыть @Talemir_bot</a>
 <input class="inp" id="code" inputmode="numeric" autocomplete="one-time-code" placeholder="Код из Telegram" maxlength="8"><button class="btn ghost" id="vgo">Войти</button><div class="err" id="lerr"></div><button class="link" id="lback">← Другой способ</button>`;
 $('#lback').onclick=showLogin;const go=async()=>{try{await api('/api/auth/tg/verify',{body:{nonce:r.nonce,code:$('#code').value}});start()}catch(e){$('#lerr').textContent=e.status===429?'Слишком много попыток — попробуйте позже.':'Неверный или устаревший код. Проверьте и введите ещё раз.'}};
 $('#vgo').onclick=go;$('#code').onkeydown=e=>{if(e.key==='Enter')go()};}
function emFlow(){const L=$('#login .lbox');
 L.innerHTML=`<div class="big">${MIRA}</div><h2>Вход по почте</h2><p>Пришлём код на почту, которую вы указывали при заказе.</p>
 <input class="inp" id="em" type="email" autocomplete="email" placeholder="you@mail.ru"><button class="btn gold" id="sgo">Получить код</button><div class="err" id="lerr"></div><button class="link" id="lback">← Другой способ</button>`;
 $('#lback').onclick=showLogin;
 const send=async()=>{const em=$('#em').value.trim();if(!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(em)){$('#lerr').textContent='Проверьте адрес почты.';return}
  try{await api('/api/auth/email',{body:{email:em}})}catch(e){$('#lerr').textContent=e.status===429?'Слишком много попыток — попробуйте через час.':e.status===503?'Почта временно недоступна — войдите через Telegram.':'Не получилось отправить код.';return}
  L.innerHTML=`<div class="big">${MIRA}</div><h2>Введите код</h2><p>Отправили на ${esc(em)}. Не видите письмо — загляните в «Спам».</p>
  <input class="inp" id="code" inputmode="numeric" autocomplete="one-time-code" placeholder="6 цифр" maxlength="6"><button class="btn gold" id="vgo">Войти</button><div class="err" id="lerr"></div><button class="link" id="lback">← Назад</button>`;
  $('#lback').onclick=emFlow;const go=async()=>{try{await api('/api/auth/email/verify',{body:{email:em,code:$('#code').value.trim()}});start()}catch(e){$('#lerr').textContent='Неверный или устаревший код.'}};
  $('#vgo').onclick=go;$('#code').onkeydown=e=>{if(e.key==='Enter')go()};};
 $('#sgo').onclick=send;$('#em').onkeydown=e=>{if(e.key==='Enter')send()};}

/* ---- menu, promo, toast ---- */
$('#meBtn').onclick=e=>{e.stopPropagation();$('#menu').classList.toggle('on')};document.addEventListener('click',()=>$('#menu').classList.remove('on'));
$('#logout').onclick=async()=>{try{await api('/api/auth/logout',{body:{}})}catch(e){}location.reload()};
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),2600)}
async function loadPromo(){try{const r=await fetch('/my/promo.json',{cache:'no-store'});if(!r.ok)return;const p=await r.json();if(!p||!p.on)return;
 let hidden=false;try{hidden=localStorage.getItem('tm_promo_x')===p.id}catch(e){}if(hidden)return;
 $('#promoT').textContent=p.title;$('#promoS').textContent=p.sub;$('#promo').style.display='flex';
 $('#promoX').onclick=e=>{e.stopPropagation();$('#promo').style.display='none';try{localStorage.setItem('tm_promo_x',p.id)}catch(e){}};
 $('#promo').onclick=()=>openSheet(`<div class="sh-h"><h3>${esc(p.title)}</h3><p>${esc(p.sub)}</p></div><div class="sh-b"><p style="margin-top:0">${esc(p.text||'')}</p><div class="acts"><a class="btn gold" style="flex:1;text-align:center;text-decoration:none" href="${esc(p.url||'https://talemir.com/')}">${esc(p.cta||'Выбрать подарок')}</a></div></div>`);
}catch(e){}}

/* ---- start ---- */
async function load(){const list=await api('/api/me/orders');const prev=cur&&cur.num;orders=(list||[]).filter(o=>o&&o.num);
 if(prev){const n=orders.find(o=>o.num===prev);if(n){const ch=stage(n)!==stage(cur);cur=n;if(ch)openChat(n.num);else{$('#cSub').textContent='Заказ № '+n.num+' · '+((ST[stage(n)]||['в работе'])[0])}}}
 renderList()}
async function start(){
 try{me=await api('/api/me')}catch(e){if(e.status===401||e.status===403){showLogin();return}$('#items').innerHTML='<div class="emptybox">Не получилось загрузить. Обновите страницу через минуту.</div>';return}
 $('#login').style.display='none';$('#list').style.display='';$('#meBtn').textContent=((me.name||me.email||'Я').trim()[0]||'Я').toUpperCase();
 try{await load()}catch(e){$('#items').innerHTML='<div class="emptybox">Не получилось загрузить подарки. Обновите страницу.</div>';return}
 if(window.innerWidth>=860&&orders.length)openChat(orders[0].num);
 setInterval(()=>{if(!document.hidden)load().catch(()=>{})},20000);
}
loadPromo();start();
})();
</script>
